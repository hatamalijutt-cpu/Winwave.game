<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
    background: #121212;
    color: white;
    font-family: Arial;
    padding: 15px;
}

/* Login Box Styles */
#loginBox {
    max-width: 300px;
    margin: 100px auto;
    background: #222;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid #333;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
}

#loginBox h2 {
    color: #10b981;
    margin-bottom: 20px;
}

/* Grid Layout for Extra Small Boxes */
.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.card {
    background: #222;
    padding: 10px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    border: 1px solid #333;
    font-size: 11px;
}

.card p {
    margin: 3px 0;
}

.uid-text {
    word-break: break-all;
    font-size: 10px;
    color: #a3a3a3;
    background: #1a1a1a;
    padding: 4px;
    border-radius: 4px;
    margin: 4px 0;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 5px;
    box-sizing: border-box;
    font-size: 12px;
}

button {
    width: 100%;
    padding: 8px;
    background: #10b981;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    font-size: 11px;
}

/* Screenshot Button Style */
.screenshot-btn {
    display: block;
    background: #f59e0b;
    color: #000;
    padding: 6px;
    margin: 6px 0;
    border-radius: 4px;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
}

.no-screenshot {
    display: block;
    background: #333;
    color: #ef4444;
    padding: 6px;
    margin: 6px 0;
    border-radius: 4px;
    font-size: 10px;
    text-align: center;
    border: 1px dashed #ef4444;
}

.view-btn {
    background: #3b82f6; 
    margin-top: 5px;
}

.details-box {
    display: none; 
    margin-top: 10px; 
    border-top: 1px dashed #555; 
    padding-top: 8px;
}

.form-card {
    background: #222;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    max-width: 400px;
}
</style>

</head>
<body>

<!-- Login Screen -->
<div id="loginBox">
    <h2>Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="checkLogin()" style="margin-top: 15px; font-size: 14px; padding: 10px;">Login</button>
</div>

<!-- Main Admin Panel (Hidden by default) -->
<div id="adminContent" style="display: none;">

    <h2>Admin Panel</h2>

    <div style="display: flex; flex-wrap: wrap; gap: 15px;">
        <div class="form-card" style="flex: 1; min-width: 250px;">
            <h3>Referral Deposit Checker</h3>
            <input type="text" id="checkUid" placeholder="Enter User UID">
            <input type="date" id="reportDate">
            <button onclick="checkReferralDeposits()">Check Deposits</button>
            <div id="referralResult" style="margin-top:10px; font-size:12px;"></div>
        </div>

        <div class="form-card" style="flex: 1; min-width: 250px;">
            <h3>Add Balance</h3>
            <input type="text" id="userUid" placeholder="User UID">
            <input type="number" id="amount" placeholder="Amount">
            <button onclick="addBalance()">Add Balance</button>
        </div>
    </div>

    <div style="display:flex;gap:10px;margin:15px 0; max-width: 400px;">
        <button onclick="showDeposits()" style="padding: 10px;">Deposit Requests</button>
        <button onclick="showWithdraws()" style="padding: 10px;">Withdraw Requests</button>
    </div>

    <div id="depositSection">
        <h3 style="margin-top: 15px; border-bottom: 2px solid #10b981; padding-bottom: 5px; display: inline-block;">
            Deposit Requests
        </h3>
        
        <div style="margin-top: 10px; max-width: 200px;">
            <label style="font-size: 12px; color: #a3a3a3;">Filter Date:</label>
            <input type="date" id="depositFilterDate" onchange="renderDeposits()">
        </div>
        
        <div id="requestBox" class="grid-container"></div> 
    </div>

    <div id="withdrawSection" style="display:none;">
        <h3 style="margin-top: 15px; border-bottom: 2px solid #10b981; padding-bottom: 5px; display: inline-block;">
            Withdraw Requests
        </h3>

        <div style="margin-top: 10px; max-width: 200px;">
            <label style="font-size: 12px; color: #a3a3a3;">Filter Date:</label>
            <input type="date" id="withdrawFilterDate" onchange="renderWithdraws()">
        </div>

        <div id="withdrawBox" class="grid-container"></div>
    </div>

</div> <!-- End of Admin Content -->

<script>
    // Login Verification Logic
    function checkLogin() {
        var user = document.getElementById("adminUser").value;
        var pass = document.getElementById("adminPass").value;

        if (user === "Qasam Ali Jutt" && pass === "Asamalijutt786@") {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
        } else {
            alert("Galat Username ya Password!");
        }
    }
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, get, update, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjw124Pc1wGpG1iNYGuKR9DmXo_OHCab8",
  authDomain: "winwave-b3ed4.firebaseapp.com",
  projectId: "winwave-b3ed4",
  storageBucket: "winwave-b3ed4.firebasestorage.app",
  messagingSenderId: "501831087781",
  appId: "1:501831087781:web:ea52d559bcb1429b9a3f4c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.toggleDetails = function(id) {
    const box = document.getElementById("details-" + id);
    if (box.style.display === "none" || box.style.display === "") {
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

window.addBalance = async function(){
    const uid = document.getElementById("userUid").value;
    const amount = Number(document.getElementById("amount").value);
    const snap = await get(ref(db,"users/"+uid));
    if(!snap.exists()){
        alert("User Not Found");
        return;
    }
    const currentBalance = snap.val().balance || 0;
    await update(ref(db,"users/"+uid), { balance: currentBalance + amount });
    alert("Balance Added Successfully");
}

window.approveDeposit = async function(requestId){
    const requestSnap = await get(ref(db,"deposit_requests/"+requestId));
    if(!requestSnap.exists()) return;
    const request = requestSnap.val();
    if(request.status === "approved"){
        alert("Already Approved");
        return;
    }
    const userSnap = await get(ref(db,"users/"+request.uid));
    if(!userSnap.exists()){
        alert("User Not Found");
        return;
    }
    const userData = userSnap.val();
    const depositCount = userData.depositCount || 0;
    const isFirstDeposit = depositCount === 0;
    const balance = userSnap.val().balance || 0;

    await update(ref(db,"users/"+request.uid), {
        balance: Number(balance) + Number(request.amount),
        totalDeposit: Number(userData.totalDeposit || 0) + Number(request.amount),
        depositCount: depositCount + 1
    });

    await set(ref(db, "depositHistory/" + request.uid + "/" + Date.now()), {
        amount: Number(request.amount),
        date: new Date().toISOString(),
        isFirstDeposit: isFirstDeposit
    });

    if (userData.referredBy) {
        const depositAmount = Number(request.amount);
        const level1Id = userData.referredBy;
        const level1Snap = await get(ref(db,"users/"+level1Id));

        if(level1Snap.exists()){
            const level1Data = level1Snap.val();
            await update(ref(db,"users/"+level1Id), {
                firstDepositAmount: (level1Data.firstDepositAmount||0) + (!userData.firstDepositBonusGiven ? Number(depositAmount) : 0),
                teamDepositTotal: (level1Data.teamDepositTotal||0) + Number(depositAmount)
            });

            if(level1Data.referredBy){
                const level2Id = level1Data.referredBy;
                const level2Snap = await get(ref(db,"users/"+level2Id));
                if(level2Snap.exists()){
                    const level2Data = level2Snap.val();
                    await update(ref(db,"users/"+level2Id), {
                        teamDepositTotal: (level2Data.teamDepositTotal||0) + Number(depositAmount)
                    });

                    if(level2Data.referredBy){
                        const level3Id = level2Data.referredBy;
                        const level3Snap = await get(ref(db,"users/"+level3Id));
                        if(level3Snap.exists()){
                            const level3Data = level3Snap.val();
                            await update(ref(db,"users/"+level3Id), {
                                teamDepositTotal: (level3Data.teamDepositTotal||0) + Number(depositAmount)
                            });
                        }
                    }
                }
            }
        }
        await update(ref(db,"users/"+request.uid), { firstDepositBonusGiven:true });
    }

    await update(ref(db,"deposit_requests/"+requestId), { status:"approved" });
    alert("Deposit Approved");
}

window.rejectDeposit = async function(requestId){
    await update(ref(db,"deposit_requests/"+requestId), { status:"rejected" });
    alert("Deposit Rejected");
}

const requestBox = document.getElementById("requestBox");
let depositDataStore = []; 

window.renderDeposits = function() {
    const filterDate = document.getElementById("depositFilterDate").value;
    requestBox.innerHTML = "";
    
    depositDataStore.forEach((child) => {
        const data = child.val();
        
        // Date Wise Checking
        if (filterDate) {
            let reqDate = "";
            if (data.date) {
                reqDate = new Date(data.date).toLocaleDateString("en-CA", {timeZone: "Asia/Karachi"});
            } else if (data.timestamp) {
                reqDate = new Date(data.timestamp).toLocaleDateString("en-CA", {timeZone: "Asia/Karachi"});
            }
            
            if (reqDate && reqDate !== filterDate) return; 
        }

        let screenshotHTML = "";
        if(data.screenshotUrl && data.screenshotUrl.trim() !== "") {
            screenshotHTML = `
                <div style="margin: 8px 0; text-align: center;">
                    <img src="${data.screenshotUrl}" style="max-width: 100%; border-radius: 4px; border: 1px solid #444;" alt="Screenshot"/>
                    <a href="${data.screenshotUrl}" download="payment_proof.png" class="screenshot-btn" style="background:#3b82f6; color:#fff; margin-top:5px;">⬇️ Download</a>
                </div>
            `;
        } else {
            screenshotHTML = `<span class="no-screenshot">🚫 No Screenshot</span>`;
        }

        requestBox.innerHTML += `
        <div class="card">
            <div style="text-align:center;">
                <h3 style="color:#10b981; margin: 0 0 5px 0; font-size:16px;">RS ${data.amount}</h3>
                <p style="margin: 0; color: ${data.status === 'Pending' ? '#f59e0b' : '#fff'}; font-size: 10px;">${data.status}</p>
            </div>
            
            <button class="view-btn" onclick="toggleDetails('d-${child.key}')">
                🔍 View
            </button>

            <div id="details-d-${child.key}" class="details-box">
                <p><b>UID:</b></p>
                <div class="uid-text">${data.uid}</div>
                <p style="margin-top:5px;"><b>TRX:</b> ${data.trxId}</p>
                
                ${screenshotHTML}

                <button onclick="approveDeposit('${child.key}')" style="margin-top:8px;">Approve</button>
                <button onclick="rejectDeposit('${child.key}')" style="background:red;margin-top:5px;">Reject</button>
            </div>
        </div>
        `;
    });
}

onValue(ref(db, "deposit_requests"), (snapshot) => {
    depositDataStore = [];
    snapshot.forEach((child) => {
        depositDataStore.push(child);
    });
    
    const filterInput = document.getElementById("depositFilterDate");
    if (!filterInput.value) {
        filterInput.value = new Date().toLocaleDateString("en-CA", {timeZone: "Asia/Karachi"});
    }
    
    renderDeposits();
});

const withdrawBox = document.getElementById("withdrawBox");
let withdrawDataStore = [];

window.renderWithdraws = function() {
    const filterDate = document.getElementById("withdrawFilterDate").value;
    withdrawBox.innerHTML = "";
    
    withdrawDataStore.forEach((child) => {
        const data = child.val();
        
        // Date Wise Checking
        if (filterDate) {
            let reqDate = "";
            if (data.date) {
                reqDate = new Date(data.date).toLocaleDateString("en-CA", {timeZone: "Asia/Karachi"});
            } else if (data.timestamp) {
                reqDate = new Date(data.timestamp).toLocaleDateString("en-CA", {timeZone: "Asia/Karachi"});
            }
            
            if (reqDate && reqDate !== filterDate) return; 
        }

        withdrawBox.innerHTML += `
        <div class="card">
            <div style="text-align:center;">
                <h3 style="color:#ef4444; margin: 0 0 5px 0; font-size:16px;">RS ${data.amount}</h3>
                <p style="margin: 0; color: ${data.status === 'Pending' ? '#f59e0b' : '#fff'}; font-size: 10px;">${data.status}</p>
            </div>

            <button class="view-btn" onclick="toggleDetails('w-${child.key}')">
                🔍 View
            </button>

            <div id="details-w-${child.key}" class="details-box">
                <p><b>UID:</b></p>
                <div class="uid-text">${data.uid}</div>
                <p style="margin-top:5px;"><b>Method:</b> ${data.method}</p>
                <p><b>Acc:</b> ${data.accountNumber}</p>

                <button onclick="approveWithdraw('${child.key}')" style="margin-top:8px;">Mark Paid</button>
                <button onclick="rejectWithdraw('${child.key}')" style="background:red;margin-top:5px;">Reject</button>
            </div>
        </div>
        `;
    });
}

onValue(ref(db,"withdrawRequests"),(snapshot)=>{
    withdrawDataStore = [];
    snapshot.forEach((child)=>{
        withdrawDataStore.push(child);
    });
    
    const filterInput = document.getElementById("withdrawFilterDate");
    if (!filterInput.value) {
        filterInput.value = new Date().toLocaleDateString("en-CA", {timeZone: "Asia/Karachi"});
    }
    
    renderWithdraws();
});

window.approveWithdraw = async function(requestId){
    await update(ref(db,"withdrawRequests/"+requestId), { status:"paid" });
    alert("Withdraw Marked Paid");
}

window.rejectWithdraw = async function(requestId){
    const requestSnap = await get(ref(db,"withdrawRequests/"+requestId));
    if(!requestSnap.exists()) return;
    const request = requestSnap.val();
    const userSnap = await get(ref(db,"users/"+request.uid));
    if(userSnap.exists()){
        const balance = userSnap.val().balance || 0;
        await update(ref(db,"users/"+request.uid), { balance: balance + request.amount });
    }
    await update(ref(db,"withdrawRequests/"+requestId), { status:"rejected" });
    alert("Withdraw Rejected & Balance Returned");
}

window.showDeposits = function(){
    document.getElementById("depositSection").style.display = "block";
    document.getElementById("withdrawSection").style.display = "none";
}

async function getAllDownlines(uid){
    let members = [];
    const referralsSnap = await get(ref(db,"users/"+uid+"/referrals"));
    if(!referralsSnap.exists()) return members;
    const referrals = referralsSnap.val();
    for(const childUid in referrals){
        members.push(childUid);
        const childMembers = await getAllDownlines(childUid);
        members = members.concat(childMembers);
    }
    return members;
}

window.checkReferralDeposits = async function(){
    const uid = document.getElementById("checkUid").value;
    const resultBox = document.getElementById("referralResult");
    const today = document.getElementById("reportDate").value;
    if(!today){
        alert("Select Date");
        return;
    }
    resultBox.innerHTML = "Loading...";
    const allMembers = await getAllDownlines(uid);
    if(allMembers.length === 0){
        resultBox.innerHTML = "No Team Found";
        return;
    }
    let todayFirstMembers = 0;
    let todayFirstDeposit = 0;
    let todayTeamDeposit = 0;
    for(const referralUid of allMembers){
        const userSnap = await get(ref(db,"users/"+referralUid));
        if(userSnap.exists()){
            const historySnap = await get(ref(db,"depositHistory/"+referralUid));
            if(historySnap.exists()){
                historySnap.forEach((h)=>{
                    const item = h.val();
                    const depositDate = new Date(item.date).toLocaleDateString("en-CA",{timeZone:"Asia/Karachi"});
                    if(depositDate === today){
                        todayTeamDeposit += Number(item.amount || 0);
                        if(item.isFirstDeposit){
                            todayFirstMembers++;
                            todayFirstDeposit += Number(item.amount || 0);
                        }
                    }
                });
            }
        }
    }
    resultBox.innerHTML = `
    <div style="margin-top:10px;">
        <p><b>First Deposit Members:</b> ${todayFirstMembers}</p>
        <p><b>First Deposit Amount:</b> ${todayFirstDeposit}</p>
        <p><b>Total Team Deposit Today:</b> ${todayTeamDeposit}</p>
        <p><b>Total Team Members:</b> ${allMembers.length}</p>
    </div>
    `;
}

window.showWithdraws = function(){
    document.getElementById("depositSection").style.display = "none";
    document.getElementById("withdrawSection").style.display = "block";
}
</script>
</body>
</html>

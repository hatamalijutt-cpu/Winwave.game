<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Signal Core</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Header Card */
        .header-card {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: #5b58ff;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .title-text h1 {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: 0.5px;
        }

        .title-text p {
            font-size: 10px;
            font-weight: 700;
            color: #5b58ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .power-btn {
            background: #fff0f2;
            color: #fb7185;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            border: none;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px #ffe4e6;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .stat-card h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .text-purple { color: #5b58ff; }
        .text-green { color: #10b981; }
        .text-orange { color: #f59e0b; }

        /* Main Prediction Card */
        .prediction-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header span {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-primary {
            background: #eef2ff;
            color: #5b58ff;
        }

        .badge-upcoming {
            background: #ecfdf5;
            color: #10b981;
        }

        .multiplier-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .live-value {
            font-size: 54px;
            font-weight: 900;
            color: #5b58ff;
            line-height: 1;
            margin-bottom: 8px;
        }

        .next-value {
            font-size: 42px;
            font-weight: 900;
            color: #10b981;
            line-height: 1;
            margin-bottom: 8px;
        }

        .box-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sync-btn {
            width: 100%;
            background: #ecfdf5;
            color: #10b981;
            border: 1px solid #d1fae5;
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fa-solid fa-plane-departure"></i>
                </div>
                <div class="title-text">
                    <h1>AVIATOR PRO</h1>
                    <p>Signal Core V5.0</p>
                </div>
            </div>
            <button class="power-btn">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <h3 class="text-purple">99.5%</h3>
                <p>Accuracy</p>
            </div>
            <div class="stat-card">
                <h3 class="text-green">ONLINE</h3>
                <p>Server</p>
            </div>
            <div class="stat-card">
                <h3 class="text-orange" id="pingStatus">10ms</h3>
                <p>Ping</p>
            </div>
        </div>

        <!-- Main Prediction Panel -->
        <div class="prediction-card">
            <div class="section-header">
                <span><i class="fa-solid fa-bolt"></i> Live Prediction</span>
                <div class="badge badge-primary">Primary</div>
            </div>
            <div class="multiplier-box">
                <div class="live-value" id="primaryPrediction">--.--x</div>
                <div class="box-label">Target Crash Point</div>
            </div>

            <div class="section-header" style="margin-top: 25px;">
                <span><i class="fa-solid fa-angles-right"></i> Next Prediction</span>
                <div class="badge badge-upcoming">Upcoming</div>
            </div>
            <div class="multiplier-box">
                <div class="next-value" id="secondaryPrediction">--.--x</div>
                <div class="box-label">Secondary Multiplier</div>
            </div>

            <button class="sync-btn">
                <div class="dot"></div>
                Real-Time Sync Active
            </button>
        </div>

        <div class="footer-text">
            <i class="fa-solid fa-shield-halved"></i> Secure & Encrypted Signal Engine
        </div>
    </div>

    <script>
        function updateSignals() {
            const primaryDOM = document.getElementById('primaryPrediction');
            const secondaryDOM = document.getElementById('secondaryPrediction');
            const pingDOM = document.getElementById('pingStatus');
            
            // Aviator Game se data uthana (Real-time sync)
            let liveVal = localStorage.getItem("aviator_live_prediction");
            let nextVal = localStorage.getItem("aviator_next_prediction");
            
            // Agar game se data mil raha hai, toh 'x' laga kar dikhaye, warna default dikhaye
            primaryDOM.innerText = liveVal ? liveVal + "x" : "--.--x";
            secondaryDOM.innerText = nextVal ? nextVal + "x" : "--.--x";

            // Ping ko live dikhane ke liye random numbers
            let fakePing = Math.floor(Math.random() * 15) + 8;
            pingDOM.innerText = fakePing + "ms";
        }

        // Har 0.5 second (500ms) mein check karega ke Aviator game mein naya crash point kya aaya hai
        setInterval(updateSignals, 500);
        
        // Pehli dafa page load hotay hi turant update karne ke liye
        updateSignals();
    </script>
</body>
</html>
